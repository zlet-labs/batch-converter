name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - zl-041-folder-converter-self-contained-prototype

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FolderConverter.sln

      - name: Build
        run: dotnet build FolderConverter.sln -c Release --no-restore

      - name: Test
        run: dotnet test FolderConverter.sln -c Release --no-build --no-restore --logger "console;verbosity=normal"
