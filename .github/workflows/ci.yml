name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Restore, build and test
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FolderConverter.sln

      - name: Build
        run: dotnet build FolderConverter.sln -c Release --no-restore

      - name: Test
        run: dotnet test FolderConverter.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Restore win-x64 runtime packs for review packaging
        shell: pwsh
        run: |
          dotnet restore src\Zlet.FolderConverter.App\Zlet.FolderConverter.App.csproj -r win-x64
          if ($LASTEXITCODE -ne 0) { throw "App win-x64 runtime restore failed." }
          dotnet restore src\Zlet.FolderConverter.OfficeWorker\Zlet.FolderConverter.OfficeWorker.csproj -r win-x64
          if ($LASTEXITCODE -ne 0) { throw "OfficeWorker win-x64 runtime restore failed." }

      - name: Install Inno Setup 6 for review packaging
        shell: pwsh
        run: |
          $knownPaths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $hasCompiler = (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -or
            ($knownPaths | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })
          if (-not $hasCompiler) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }
          }

      - name: Build portable and installer review packages
        shell: pwsh
        run: |
          .\scripts\build-installer.ps1
          if ($LASTEXITCODE -ne 0) { throw "Review packaging failed." }

      - name: Upload ZL-057 review packages
        uses: actions/upload-artifact@v4
        with:
          name: zl-057-zlet-converter-review-build
          path: |
            artifacts/portable/win-x64/ZletConverter-v0.0.2-win-x64.zip
            artifacts/installer/win-x64/ZletConverter-v0.0.2-Setup-win-x64.exe
          if-no-files-found: error
          retention-days: 1
