name: Publish v0.0.2 Pre-release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.0.2.yml'

permissions:
  contents: write

jobs:
  publish:
    name: Validate and publish v0.0.2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.0.2
      EXPECTED_TARGET: 21efb0e53139864064d699f2faf520af1f7354d8
      INSTALLER_NAME: ZletBatchConverter-v0.0.2-Setup-win-x64.exe
      INSTALLER_SIZE: '50314546'
      INSTALLER_DIGEST: sha256:519855e75ed63385b914bf7cb37efa7a42717728ae6420e6291dcb27e8ed58d5
      PORTABLE_NAME: ZletBatchConverter-v0.0.2-win-x64.zip
      PORTABLE_SIZE: '72465992'
      PORTABLE_DIGEST: sha256:998854d1e64f605fd140ba60c52d6e22257265905fdb4e254a80cfe57e2643b0
      CHECKSUMS_NAME: SHA256SUMS.txt
      CHECKSUMS_SIZE: '216'

    steps:
      - name: Validate exact draft release
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          releases_json="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          release_count="$(jq --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)] | length' <<< "$releases_json")"

          if [[ "$release_count" != "1" ]]; then
            echo "Expected exactly one release with tag $RELEASE_TAG, found $release_count." >&2
            exit 1
          fi

          release_json="$(jq -c --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)] | .[0]' <<< "$releases_json")"
          release_id="$(jq -r '.id' <<< "$release_json")"
          draft="$(jq -r '.draft' <<< "$release_json")"
          prerelease="$(jq -r '.prerelease' <<< "$release_json")"
          target="$(jq -r '.target_commitish' <<< "$release_json")"
          title="$(jq -r '.name' <<< "$release_json")"

          [[ "$draft" == "true" ]] || { echo "$RELEASE_TAG is not a draft; refusing to mutate it." >&2; exit 1; }
          [[ "$prerelease" == "true" ]] || { echo "$RELEASE_TAG is not marked as pre-release; refusing to publish it." >&2; exit 1; }
          [[ "$target" == "$EXPECTED_TARGET" ]] || { echo "Unexpected release target: $target" >&2; exit 1; }
          [[ "$title" == "Zlet Batch Converter v0.0.2" ]] || { echo "Unexpected release title: $title" >&2; exit 1; }

          validate_asset() {
            local name="$1"
            local expected_size="$2"
            local expected_digest="$3"
            local asset_count asset_size asset_digest

            asset_count="$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' <<< "$release_json")"
            [[ "$asset_count" == "1" ]] || { echo "Expected exactly one asset named $name, found $asset_count." >&2; exit 1; }

            asset_size="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .size' <<< "$release_json")"
            [[ "$asset_size" == "$expected_size" ]] || { echo "Unexpected size for $name: $asset_size" >&2; exit 1; }

            if [[ -n "$expected_digest" ]]; then
              asset_digest="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest // ""' <<< "$release_json")"
              [[ "$asset_digest" == "$expected_digest" ]] || { echo "Unexpected digest for $name: $asset_digest" >&2; exit 1; }
            fi
          }

          validate_asset "$INSTALLER_NAME" "$INSTALLER_SIZE" "$INSTALLER_DIGEST"
          validate_asset "$PORTABLE_NAME" "$PORTABLE_SIZE" "$PORTABLE_DIGEST"
          validate_asset "$CHECKSUMS_NAME" "$CHECKSUMS_SIZE" ""

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

          {
            echo "## v0.0.2 publication guard"
            echo "- Draft release found exactly once"
            echo "- Target commit verified: \`$EXPECTED_TARGET\`"
            echo "- Installer, portable ZIP and SHA256SUMS.txt verified"
            echo "- Installer/portable sizes and SHA-256 digests verified"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish existing pre-release
        shell: bash
        run: |
          set -euo pipefail

          release_id="${{ steps.validate.outputs.release_id }}"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -F prerelease=true \
            > published-release.json

          draft="$(jq -r '.draft' published-release.json)"
          prerelease="$(jq -r '.prerelease' published-release.json)"
          tag="$(jq -r '.tag_name' published-release.json)"
          target="$(jq -r '.target_commitish' published-release.json)"
          published_at="$(jq -r '.published_at // ""' published-release.json)"
          url="$(jq -r '.html_url' published-release.json)"

          [[ "$tag" == "$RELEASE_TAG" ]] || { echo "Published release tag changed unexpectedly: $tag" >&2; exit 1; }
          [[ "$target" == "$EXPECTED_TARGET" ]] || { echo "Published release target changed unexpectedly: $target" >&2; exit 1; }
          [[ "$draft" == "false" ]] || { echo "Release is still a draft." >&2; exit 1; }
          [[ "$prerelease" == "true" ]] || { echo "Release lost pre-release status." >&2; exit 1; }
          [[ -n "$published_at" ]] || { echo "published_at is empty after publication." >&2; exit 1; }

          {
            echo "## Published"
            echo "- Release: $RELEASE_TAG"
            echo "- Status: published pre-release"
            echo "- Published at: $published_at"
            echo "- URL: $url"
            echo "- No binaries were rebuilt or replaced"
          } >> "$GITHUB_STEP_SUMMARY"
