name: ZL-061 one-time version test patch

on:
  push:
    branches:
      - zl-061-release-v0.0.3

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: zl-061-release-v0.0.3
          fetch-depth: 1

      - name: Patch stale v0.0.2 expectation and remove helper workflow
        shell: pwsh
        run: |
          $path = "tests\Zlet.FolderConverter.Tests\PresentationTests.cs"
          $text = [IO.File]::ReadAllText($path)
          $old = 'Assert.EndsWith("ZletConverter-v0.0.2-results.zip", viewModel.OutputPath);'
          $new = 'Assert.EndsWith("ZletConverter-v0.0.3-results.zip", viewModel.OutputPath);'
          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 1) {
            throw "Expected exactly one stale result ZIP assertion, found $count."
          }
          $text = $text.Replace($old, $new)
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))

          Remove-Item -LiteralPath ".github\workflows\zl-061-patch-version-test.yml" -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $path .github/workflows/zl-061-patch-version-test.yml
          git diff --cached --check
          git commit -m "CU-ZL-061 Update v0.0.3 result ZIP expectation"
          git push origin HEAD:zl-061-release-v0.0.3
