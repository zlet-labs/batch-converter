<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Zlet Batch Converter</title>
  <desc id="desc">Product banner for Zlet Batch Converter, a local Windows batch file converter from Zlet Labs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#162033"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7ff"/>
      <stop offset="1" stop-color="#7c8cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="50" r="210" fill="#24408f" opacity="0.13"/>
  <circle cx="945" cy="330" r="190" fill="#27c1cc" opacity="0.08"/>

  <g transform="translate(70 68)">
    <rect width="72" height="72" rx="20" fill="url(#accent)"/>
    <path d="M20 20h34L30 52h25" fill="none" stroke="#07111e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif">
    <text x="70" y="190" font-size="52" font-weight="700">Zlet Batch Converter</text>
    <text x="70" y="232" font-size="24" fill="#cbd5e1">Local Windows batch file conversion</text>
    <text x="70" y="275" font-size="18" fill="#94a3b8">DOC → DOCX   ·   XLS → XLSX   ·   PPT → PPTX</text>
    <text x="70" y="309" font-size="16" fill="#6ee7ff">Local only  •  No cloud uploads  •  Safe no-overwrite workflow</text>
    <text x="70" y="335" font-size="14" fill="#64748b">Zlet Labs</text>
  </g>

  <g transform="translate(745 64)" filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect width="385" height="232" rx="24" fill="#0f172a" stroke="#334155"/>
    <rect x="28" y="25" width="132" height="46" rx="12" fill="#172033" stroke="#334155"/>
    <path d="M47 48h24l8 8h55v31H47z" transform="translate(0 -18)" fill="#24334d" stroke="#6ee7ff" stroke-width="1.5"/>
    <text x="83" y="54" font-size="14" fill="#dbeafe">Folder</text>

    <g font-size="13" font-weight="600">
      <rect x="28" y="94" width="72" height="34" rx="10" fill="#2a1f35" stroke="#a78bfa"/>
      <text x="49" y="116" fill="#ddd6fe">DOC</text>
      <rect x="111" y="94" width="72" height="34" rx="10" fill="#173126" stroke="#34d399"/>
      <text x="134" y="116" fill="#d1fae5">XLS</text>
      <rect x="194" y="94" width="72" height="34" rx="10" fill="#3a2419" stroke="#fb923c"/>
      <text x="216" y="116" fill="#ffedd5">PPT</text>
    </g>

    <path d="M286 111h38" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <path d="M317 103l10 8-10 8" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g font-size="12" font-weight="600">
      <rect x="28" y="151" width="92" height="34" rx="10" fill="#1d2a45" stroke="#60a5fa"/>
      <text x="49" y="173" fill="#dbeafe">DOCX</text>
      <rect x="131" y="151" width="92" height="34" rx="10" fill="#18352b" stroke="#34d399"/>
      <text x="153" y="173" fill="#d1fae5">XLSX</text>
      <rect x="234" y="151" width="92" height="34" rx="10" fill="#3b2519" stroke="#fb923c"/>
      <text x="255" y="173" fill="#ffedd5">PPTX</text>
    </g>

    <g transform="translate(28 202)">
      <circle cx="11" cy="10" r="10" fill="#16372f" stroke="#34d399"/>
      <path d="M7 10l3 3 6-7" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="15" font-size="13" fill="#a7f3d0">Processed on your PC</text>
      <text x="238" y="15" font-size="12" fill="#64748b">PRE-ALPHA</text>
    </g>
  </g>
</svg>
